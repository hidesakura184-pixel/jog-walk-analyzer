<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ジョグ＆ウォーク分析 v0.3</title><style>body{font-family:-apple-system,system-ui,sans-serif;background:#f3f7f5;color:#183a30;margin:0;padding:16px}main{max-width:780px;margin:auto}section{background:white;padding:17px;border-radius:15px;margin:14px 0}h1{font-size:1.45rem}h2{font-size:1.1rem}input{max-width:100%}button{background:#147d68;color:white;border:0;padding:10px;border-radius:8px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats div{background:#edf6f1;border-radius:9px;padding:12px}.stats strong{font-size:1.5rem}small{display:block;color:#586d65}canvas{width:100%;height:230px}#status{white-space:pre-wrap;color:#235f51}table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{padding:8px 3px;border-bottom:1px solid #ddd;text-align:left}.scroll{overflow-x:auto}p{line-height:1.5}</style><main><h1>🏃 ジョグ＆ウォーク分析 v0.3</h1><p>iPhone対応を優先した軽量版。TCXを端末内で解析し、集計値だけ保存します。</p><section><h2>① TCXを読み込む</h2><input type="file" id="file" accept=".tcx,.xml,text/xml,application/xml"><p id="status">ファイルを選んでください。</p><label>ジョグ判定 <input type="number" id="threshold" value="140" min="100" max="220" style="width:65px"> 歩/分以上</label><button id="apply">再集計</button></section><section><h2>② 最新の記録</h2><div class="stats"><div><small>総距離</small><strong id="total">—</strong></div><div><small>ジョグ推定距離</small><strong id="jog">—</strong></div><div><small>ウォーク等</small><strong id="walk">—</strong></div><div><small>ジョグ率</small><strong id="ratio">—</strong></div></div><p id="detail"></p></section><section><h2>③ 推移グラフ</h2><canvas id="graph"></canvas><div class="scroll"><table><thead><tr><th>日付</th><th>総距離</th><th>ジョグ</th><th>割合</th></tr></thead><tbody id="rows"></tbody></table></div><button id="clear">記録を消去</button></section><p><small>緑＝ジョグ、黄＝ウォーク等。ケイデンスによる推定であり、実際の走行距離とは誤差があります。ファイルプレビューでは保存できない場合があります。</small></p></main><script>
(function(){'use strict';const $=id=>document.getElementById(id),KEY='jogwalk-summary-v03';let records=[];try{records=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}const say=s=>{$('status').textContent=s};function find(node,tag){const a=node.getElementsByTagNameNS('*',tag);return a.length?a[0]:null}function value(node,tag){let x=find(node,tag);return x?x.textContent.trim():''}function number(s){let x=Number(s);return Number.isFinite(x)?x:NaN}function fmt(x){return (x/1000).toFixed(2)+' km'}function save(){try{localStorage.setItem(KEY,JSON.stringify(records))}catch(e){say('解析完了。ただし、このプレビューでは記録の保存ができません。\n'+e.message)}}function render(){let sorted=records.slice().sort((a,b)=>a.date.localeCompare(b.date));let r=sorted[sorted.length-1];for(let id of ['total','jog','walk','ratio'])$(id).textContent='—';$('detail').textContent='';if(r){$('total').textContent=fmt(r.total);$('jog').textContent=fmt(r.jog);$('walk').textContent=fmt(r.total-r.jog);$('ratio').textContent=(100*r.jog/r.total).toFixed(1)+'%';$('detail').textContent=r.date+' / '+r.name}let rows=$('rows');rows.replaceChildren();sorted.forEach(r=>{let tr=document.createElement('tr');[r.date,fmt(r.total),fmt(r.jog),(100*r.jog/r.total).toFixed(1)+'%'].forEach(s=>{let td=document.createElement('td');td.textContent=s;tr.appendChild(td)});rows.appendChild(tr)});let c=$('graph'),w=c.clientWidth||330,h=230,dpr=Math.min(window.devicePixelRatio||1,2);c.width=w*dpr;c.height=h*dpr;let g=c.getContext('2d');if(!g)return;g.scale(dpr,dpr);g.fillStyle='#65766d';g.font='12px system-ui';if(!sorted.length){g.fillText('TCXを読み込むとグラフが表示されます',15,110);return}let max=Math.max(...sorted.map(r=>r.total),1)*1.1,slot=(w-40)/sorted.length,bw=Math.min(45,slot*.6);sorted.forEach((r,i)=>{let x=30+slot*i+(slot-bw)/2,base=185,jh=155*r.jog/max,wh=155*(r.total-r.jog)/max;g.fillStyle='#d5a447';g.fillRect(x,base-wh,bw,wh);g.fillStyle='#16856e';g.fillRect(x,base-wh-jh,bw,jh);if(sorted.length<12){g.fillStyle='#65766d';g.fillText(r.date.slice(5),x,207)}})}
$('file').addEventListener('change',async function(){let f=this.files&&this.files[0];if(!f)return;try{say('1/4 ファイル読み込み中… ('+Math.round(f.size/1024)+' KB)');let txt=await new Promise((resolve,reject)=>{let fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=()=>reject(new Error('ファイルの読み込みに失敗'));fr.readAsText(f)});say('2/4 XMLを解析中…');await new Promise(r=>setTimeout(r,10));let doc=new DOMParser().parseFromString(txt,'application/xml');if(doc.getElementsByTagName('parsererror').length)throw Error('XML形式が読み取れません');let act=find(doc,'Activity');if(!act)throw Error('Activityが見つかりません');let lap=find(act,'Lap'),points=act.getElementsByTagNameNS('*','Trackpoint');say('3/4 '+points.length+'点を集計中…');await new Promise(r=>setTimeout(r,10));let threshold=Number($('threshold').value)||140,prev=null,jog=0,classified=0,hrSum=0,hrN=0,validCad=[];let arr=[];for(let i=0;i<points.length;i++){let p=points[i],t=Date.parse(value(p,'Time')),dist=number(value(p,'DistanceMeters')),cad=number(value(p,'Cadence')),hr=number(value(p,'Value'));if(!Number.isFinite(t))continue;arr.push({t,dist,cad,hr});if(cad*2>0)validCad.push(cad)}validCad.sort((a,b)=>a-b);let scale=validCad.length&&validCad[Math.floor(validCad.length/2)]<110?2:1;for(let p of arr){if(prev){let dt=(p.t-prev.t)/1000,dd=p.dist-prev.dist;if(dt>0&&dt<=12&&dd>=0&&dd<80){classified+=dd;if((p.cad>0?p.cad:prev.cad)*scale>=threshold)jog+=dd}}prev=p;if(p.hr>0){hrSum+=p.hr;hrN++}}let total=number(value(lap,'DistanceMeters'));if(!(total>0))total=classified;if(!(total>0))throw Error('距離が見つかりません');jog=Math.min(jog,total);let iso=value(act,'Id'),date=new Date(iso);let dateStr=Number.isNaN(date.getTime())?iso.slice(0,10):new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(date);let record={id:iso||f.name,date:dateStr,name:f.name,total,jog,threshold,hr:hrN?Math.round(hrSum/hrN):null};say('4/4 グラフ更新中…');records=records.filter(x=>x.id!==record.id);records.push(record);render();say('読み込み成功：'+dateStr+' / '+points.length+'点\nジョグ推定 '+fmt(jog)+'、総距離 '+fmt(total));save()}catch(e){say('エラー：'+(e&&e.message||String(e)))}finally{this.value=''}});$('apply').onclick=()=>say('判定基準を変えた場合は、TCXを再読み込みしてください（保存済み集計値は変更されません）。');$('clear').onclick=()=>{if(confirm('保存済み記録を消去しますか？')){records=[];save();render();say('記録を消去しました')}};window.addEventListener('resize',render);render()})();
</script></html>
